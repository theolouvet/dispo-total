name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # chaque lundi : mise à jour de la liste des stations Total
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Si OpenStreetMap ne répond pas, on garde la liste versionnée.
      - run: npm run maj-total || echo "Liste Total non mise à jour"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
